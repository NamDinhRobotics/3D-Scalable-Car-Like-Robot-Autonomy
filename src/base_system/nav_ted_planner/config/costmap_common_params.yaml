robot_base_frame: base_link
footprint: [[-0.35, -0.2], [-0.35, 0.2], [0.35, 0.2], [0.35, -0.2]]  # 0.7m x 0.4m
# robot_radius: 0.35  # Uncomment if using a circular footprint instead

obstacle_range: 2.5
raytrace_range: 3.0

observation_sources: laser_scan_sensor
laser_scan_sensor:
  sensor_frame: laser_frame  # Replace with your actual sensor frame
  data_type: LaserScan       # Assuming scan_cloud is a LaserScan
  topic: /scan_cloud
  marking: true
  clearing: true

inflation_radius: 0.5
cost_scaling_factor: 10.0
